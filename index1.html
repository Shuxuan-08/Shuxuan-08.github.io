<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚自习复习清单</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* 输入区域 */
        .form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .add-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #357abd;
        }

        /* 提示信息 */
        .message {
            min-height: 24px;
            margin-bottom: 15px;
            color: #e74c3c;
            font-size: 14px;
        }

        /* 统计 */
        .summary {
            background: #eef5ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .summary strong {
            color: #e67e22;
            font-size: 20px;
        }

        /* 任务列表 */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: #fff;
        }

        .task-item:hover {
            background: #fafafa;
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-name {
            flex: 1;
            font-size: 16px;
        }

        .task-minutes {
            color: #666;
            font-size: 14px;
        }

        /* 完成状态 */
        .task-item.completed .task-name {
            text-decoration: line-through;
            color: #999;
        }

        .task-item.completed .task-minutes {
            color: #aaa;
        }

        .delete-btn {
            border: none;
            background: #ff6b6b;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e74c3c;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }

        /* 手机端 */
        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 20px;
            }

            .form {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .task-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 晚自习复习清单</h1>

    <!-- 输入区域 -->
    <div class="form">
        <input
            type="text"
            id="taskName"
            placeholder="请输入任务名称，例如：复习数学"
        >

        <input
            type="number"
            id="taskMinutes"
            placeholder="分钟（1-180）"
        >

        <button class="add-btn" id="addBtn">
            添加任务
        </button>
    </div>

    <!-- 错误提示 -->
    <div class="message" id="message"></div>

    <!-- 未完成任务总分钟数 -->
    <div class="summary">
        未完成任务总分钟数：
        <strong id="totalMinutes">0</strong>
        分钟
    </div>

    <!-- 任务列表 -->
    <ul class="task-list" id="taskList">
        <li class="empty" id="emptyMessage">
            暂时没有任务，开始添加吧！
        </li>
    </ul>

</div>


<script>
    // ==============================
    // 1. 状态
    // ==============================

    let tasks = [];


    // ==============================
    // 2. 获取页面元素
    // ==============================

    const taskNameInput = document.getElementById("taskName");
    const taskMinutesInput = document.getElementById("taskMinutes");
    const addBtn = document.getElementById("addBtn");

    const message = document.getElementById("message");
    const taskList = document.getElementById("taskList");

    const totalMinutes = document.getElementById("totalMinutes");
    const emptyMessage = document.getElementById("emptyMessage");


    // ==============================
    // 3. 添加任务事件
    // ==============================

    addBtn.addEventListener("click", addTask);


    // 按 Enter 也可以添加
    taskNameInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    });

    taskMinutesInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    });


    // ==============================
    // 4. 添加任务
    // ==============================

    function addTask() {

        // 清除之前的提示
        message.textContent = "";

        const name = taskNameInput.value.trim();
        const minutesText = taskMinutesInput.value.trim();

        // ---------- 输入验证 ----------

        // 任务名称不能为空
        if (name === "") {
            message.textContent = "请输入任务名称！";
            taskNameInput.focus();
            return;
        }

        // 分钟不能为空
        if (minutesText === "") {
            message.textContent = "请输入任务分钟数！";
            taskMinutesInput.focus();
            return;
        }

        const minutes = Number(minutesText);

        // 必须是数字
        if (!Number.isFinite(minutes)) {
            message.textContent = "分钟数必须是数字！";
            return;
        }

        // 必须是整数
        if (!Number.isInteger(minutes)) {
            message.textContent = "分钟数必须是整数，不能输入小数！";
            return;
        }

        // 1-180
        if (minutes < 1) {
            message.textContent = "分钟数不能小于 1！";
            return;
        }

        if (minutes > 180) {
            message.textContent = "分钟数不能大于 180！";
            return;
        }


        // ---------- 创建任务 ----------

        const task = {
            id: Date.now(),
            name: name,
            minutes: minutes,
            completed: false
        };

        tasks.push(task);


        // ---------- 清空输入框 ----------

        taskNameInput.value = "";
        taskMinutesInput.value = "";

        taskNameInput.focus();


        // ---------- 更新页面 ----------

        render();
    }


    // ==============================
    // 5. 删除任务
    // ==============================

    function deleteTask(id) {

        tasks = tasks.filter(function(task) {
            return task.id !== id;
        });

        render();
    }


    // ==============================
    // 6. 完成 / 取消完成
    // ==============================

    function toggleTask(id) {

        tasks = tasks.map(function(task) {

            if (task.id === id) {
                return {
                    ...task,
                    completed: !task.completed
                };
            }

            return task;
        });

        render();
    }


    // ==============================
    // 7. 计算未完成任务总分钟数
    // ==============================

    function calculateTotalMinutes() {

        let total = 0;

        tasks.forEach(function(task) {

            // 只有未完成的任务才计算
            if (!task.completed) {
                total += task.minutes;
            }

        });

        return total;
    }


    // ==============================
    // 8. 渲染任务列表
    // ==============================

    function render() {

        // 清空列表
        taskList.innerHTML = "";


        // 没有任务
        if (tasks.length === 0) {

            const empty = document.createElement("li");

            empty.className = "empty";
            empty.textContent = "暂时没有任务，开始添加吧！";

            taskList.appendChild(empty);

        } else {

            // 有任务时逐个生成
            tasks.forEach(function(task) {

                const li = document.createElement("li");

                li.className = "task-item";

                // 完成状态
                if (task.completed) {
                    li.classList.add("completed");
                }


                // Checkbox
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                checkbox.addEventListener("change", function() {
                    toggleTask(task.id);
                });


                // 任务名称
                const name = document.createElement("span");

                name.className = "task-name";
                name.textContent = task.name;


                // 分钟数
                const minutes = document.createElement("span");

                minutes.className = "task-minutes";
                minutes.textContent = task.minutes + " 分钟";


                // 删除按钮
                const deleteBtn = document.createElement("button");

                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "删除";

                deleteBtn.addEventListener("click", function() {
                    deleteTask(task.id);
                });


                // 添加到 li
                li.appendChild(checkbox);
                li.appendChild(name);
                li.appendChild(minutes);
                li.appendChild(deleteBtn);

                taskList.appendChild(li);
            });
        }


        // 更新总分钟数
        totalMinutes.textContent = calculateTotalMinutes();
    }


    // ==============================
    // 9. 初始渲染
    // ==============================

    render();

</script>

</body>
</html>
